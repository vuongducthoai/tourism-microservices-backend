server:
  port: 8081

spring:
  application:
    name: iam-service

  # ─── Database ───
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/iam_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── File Upload ───
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── Mail ───
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:your-email@gmail.com}
    password: ${MAIL_PASSWORD:your-app-password}
    properties:
      mail.smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # ─── OAuth2 ───
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:your-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your-google-secret}
            scope: profile,email
            redirect-uri: "{baseUrl}/api/auth/google/callback"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub

  # ─── Redis ───
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    timeout: 10s

  # ─── RabbitMQ ───
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}

# ─── JWT Config ───
jwt:
  secret: ${JWT_SECRET:59379ea8-777d-49e1-ac8e-03420874f6a3}
  access-token-expiration: 604800000   # 7 days
  refresh-token-expiration: 1209600000 # 14 days

# ─── Cloudinary ───
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dnt8vx1at}
  api-key: ${CLOUDINARY_API_KEY:939641688935771}
  api-secret: ${CLOUDINARY_API_SECRET:WPzZSJqg4MVvHKUuvPFeHL981J0}

# ─── Eureka ───
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

# ─── App Config ───
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# ─── Actuator ───
management:
  endpoints:
    web:
      exposure:
        include: health,info
