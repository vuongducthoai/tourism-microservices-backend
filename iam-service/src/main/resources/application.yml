server:
  port: 8081

spring:
  application:
    name: iam-service

  # ─── Database ───
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/iam_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── File Upload ───
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ─── Mail ───
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:trananhthu270904@gmail.com}
    password: ${MAIL_PASSWORD:yfqh vdil pdob euuz}
    properties:
      mail.smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # ─── Redis ───
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10s

  # ─── RabbitMQ ───
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}

  # ─── OAuth2 Resource Server (validate Keycloak JWT) ───
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism/protocol/openid-connect/certs

# ─── Cloudinary ───
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dnt8vx1at}
  api-key: ${CLOUDINARY_API_KEY:939641688935771}
  api-secret: ${CLOUDINARY_API_SECRET:WPzZSJqg4MVvHKUuvPFeHL981J0}

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8180}
  realm: ${KEYCLOAK_REALM:tourism}
  client-id: ${KEYCLOAK_CLIENT_ID:tourism-app}
  client-secret: ${KEYCLOAK_CLIENT_SECRET:tourism-app-secret}
  admin-username: ${KEYCLOAK_ADMIN_USERNAME:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

# ─── Eureka ───
eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

# ─── App Config ───
app:
  cors:
    allowed-origins: http://localhost:3000,http://localhost:3001
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}

# ─── Actuator ───
management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


