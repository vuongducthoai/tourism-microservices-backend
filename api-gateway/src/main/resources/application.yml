server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "http://localhost:3001"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - PATCH
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

      routes:
        # ─── IAM Service ───
        - id: iam-service
          uri: lb://iam-service
          predicates:
            - Path=/api/auth/**, /api/admin/auth/**, /api/users/**, /api/admin/profile/**, /api/admin/users/**
          filters:
            - StripPrefix=0

        # ─── Tour Catalog Service ───
        - id: tour-catalog-service
          uri: lb://tour-catalog-service
          predicates:
            - Path=/api/tours/**, /api/admin/tours/**, /api/locations/**, /api/admin/locations/**, /api/departures/**, /api/reviews/**, /api/favorite-tours/**, /api/branch-contacts/**, /api/policy-templates/**, /api/tour-media/**
          filters:
            - StripPrefix=0

        # ─── Booking Service ───
        - id: booking-service
          uri: lb://booking-service
          predicates:
            - Path=/api/bookings/**, /api/coupons/**, /api/admin/bookings/**
          filters:
            - StripPrefix=0

        # ─── Payment Service ───
        - id: payment-service
          uri: lb://payment-service
          predicates:
            - Path=/api/payment/**
          filters:
            - StripPrefix=0

        # ─── Forum Service ───
        - id: forum-service
          uri: lb://forum-service
          predicates:
            - Path=/api/posts/**, /api/tags/**, /api/categories/**, /api/bookmarks/**, /api/followers/**
          filters:
            - StripPrefix=0

        # ─── Notification Service ───
        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=0

        # ─── Notification Service — WebSocket (SockJS) ───
        # MUST be declared separately with lb:ws:// scheme so Spring Cloud Gateway
        # performs the HTTP→WebSocket upgrade and proxies STOMP frames.
        # SockJS uses: GET /ws/info  +  /ws/{server}/{session}/{transport}
        - id: notification-service-websocket
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**
          filters:
            - StripPrefix=0

        # ─── Analytics Service — Admin Dashboard (rewrite /api/admin/dashboard → /api/dashboard) ───
        - id: analytics-service-admin-dashboard
          uri: lb://analytics-service
          predicates:
            - Path=/api/admin/dashboard/**
          filters:
            - RewritePath=/api/admin/dashboard/(?<seg>.*), /api/dashboard/${seg}

        # ─── Analytics Service ───
        - id: analytics-service
          uri: lb://analytics-service
          predicates:
            - Path=/api/dashboard/**, /api/chatbot/**
          filters:
            - StripPrefix=0

        # OpenAPI docs for Swagger UI aggregation
        - id: iam-service-openapi
          uri: lb://iam-service
          predicates:
            - Path=/v3/api-docs/iam-service
          filters:
            - RewritePath=/v3/api-docs/iam-service, /v3/api-docs

        - id: tour-catalog-service-openapi
          uri: lb://tour-catalog-service
          predicates:
            - Path=/v3/api-docs/tour-catalog-service
          filters:
            - RewritePath=/v3/api-docs/tour-catalog-service, /v3/api-docs

        - id: booking-service-openapi
          uri: lb://booking-service
          predicates:
            - Path=/v3/api-docs/booking-service
          filters:
            - RewritePath=/v3/api-docs/booking-service, /v3/api-docs

        - id: payment-service-openapi
          uri: lb://payment-service
          predicates:
            - Path=/v3/api-docs/payment-service
          filters:
            - RewritePath=/v3/api-docs/payment-service, /v3/api-docs

        - id: forum-service-openapi
          uri: lb://forum-service
          predicates:
            - Path=/v3/api-docs/forum-service
          filters:
            - RewritePath=/v3/api-docs/forum-service, /v3/api-docs

        - id: notification-service-openapi
          uri: lb://notification-service
          predicates:
            - Path=/v3/api-docs/notification-service
          filters:
            - RewritePath=/v3/api-docs/notification-service, /v3/api-docs

        - id: analytics-service-openapi
          uri: lb://analytics-service
          predicates:
            - Path=/v3/api-docs/analytics-service
          filters:
            - RewritePath=/v3/api-docs/analytics-service, /v3/api-docs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    urls-primary-name: IAM Service
    urls:
      - name: IAM Service
        url: /v3/api-docs/iam-service
      - name: Tour Catalog Service
        url: /v3/api-docs/tour-catalog-service
      - name: Booking Service
        url: /v3/api-docs/booking-service
      - name: Payment Service
        url: /v3/api-docs/payment-service
      - name: Forum Service
        url: /v3/api-docs/forum-service
      - name: Notification Service
        url: /v3/api-docs/notification-service
      - name: Analytics Service
        url: /v3/api-docs/analytics-service

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/

jwt:
  secret: ${JWT_SECRET:59379ea8-777d-49e1-ac8e-03420874f6a3}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
