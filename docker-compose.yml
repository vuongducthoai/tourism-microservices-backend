version: '3.8'

services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: tourism-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      TZ: Asia/Ho_Chi_Minh
      PGTZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tourism-network

  # --- Redis ---
  redis:
    image: redis:7-alpine
    container_name: tourism-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tourism-network

  # --- Keycloak (Identity Provider) ---
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: tourism-keycloak
    # start-dev: chế độ development (HTTP, log chi tiết, hot reload theme)
    # --import-realm: tự động import realm-export.json khi khởi động lần đầu
    command: start-dev --import-realm
    environment:
      # Dùng chung PostgreSQL container, chỉ khác database keycloak_db
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres
      # Tài khoản đăng nhập Keycloak Admin Console (http://localhost:8180)
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Cho phép HTTP, không bắt HTTPS (dev only)
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      # Google OAuth2 Configuration (đọc từ .env file)
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
    ports:
      # Truy cập Admin Console: http://localhost:8180
      - "8180:8080"
    volumes:
      # realm-export.json chứa cấu hình realm tourism (client, roles, mappers)
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - tourism-network

  # --- RabbitMQ ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: tourism-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: tourism
      RABBITMQ_DEFAULT_PASS: tourism123
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "check_running" ]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - tourism-network

  # ======================== CORE SERVICES ========================

  # --- Service Discovery (Eureka) ---
  service-discovery:
    build:
      context: ./service-discovery
      dockerfile: Dockerfile
    container_name: tourism-service-discovery
    ports:
      - "8761:8761"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - EUREKA_HOST=service-discovery
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - tourism-network

  # --- Config Server ---
  config-server:
    build:
      context: ./config-server
      dockerfile: Dockerfile
    container_name: tourism-config-server
    ports:
      - "8888:8888"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - EUREKA_HOST=service-discovery
    depends_on:
      service-discovery:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8888/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - tourism-network

  # --- API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: tourism-api-gateway
    ports:
      - "8080:8080"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      # Validate Keycloak JWTs against the in-network host (tokens are minted via
      # iam-service at http://keycloak:8080). Without this the gateway defaults to
      # localhost:8180 — unreachable inside the container — so it can't decode the
      # JWT and never forwards the X-User-Role header.
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
    depends_on:
      service-discovery:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - tourism-network

  # ======================== BUSINESS SERVICES ========================

  # --- IAM Service ---
  iam-service:
    build:
      context: ./iam-service
      dockerfile: Dockerfile
    container_name: tourism-iam-service
    ports:
      - "8081:8081"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/iam_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      
      # Keycloak connection 
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=tourism
      - KEYCLOAK_CLIENT_ID=tourism-app
      - KEYCLOAK_CLIENT_SECRET=tourism-app-secret
      - KEYCLOAK_ADMIN_USERNAME=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8081/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Tour Catalog Service ---
  tour-catalog-service:
    build:
      context: ./tour-catalog-service
      dockerfile: Dockerfile
    container_name: tourism-tour-catalog-service
    ports:
      - "8082:8082"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/tour_catalog_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8082/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Booking Service ---
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: tourism-booking-service
    ports:
      - "8083:8083"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/booking_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Payment Service ---
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    container_name: tourism-payment-service
    ports:
      - "8084:8084"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8084/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Forum Service ---
  forum-service:
    build:
      context: ./forum-service
      dockerfile: Dockerfile
    container_name: tourism-forum-service
    ports:
      - "8085:8085"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/forum_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - GROQ_API_KEY=${GROQ_API_KEY}
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8085/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Notification Service ---
  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: tourism-notification-service
    ports:
      - "8086:8086"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/notification_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - REDIS_HOST=redis
      - MAIL_USERNAME=tranthu270904@gmail.com
      - MAIL_PASSWORD=nljt djst fhfp bmgn
      - ADMIN_EMAIL=22110431@student.hcmute.edu.vn
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=tourism
      - RABBITMQ_PASSWORD=tourism123
    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8086/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

  # --- Analytics Service ---
  analytics-service:
    build:
      context: ./analytics-service
      dockerfile: Dockerfile
    container_name: tourism-analytics-service
    ports:
      - "8087:8087"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    dns_opt:
      - timeout:2
      - attempts:3
    extra_hosts:
      # Docker DNS on Windows can intermittently fail to resolve Pinecone,
      # which makes chatbot tour retrieval return empty results.
      - "api.pinecone.io:34.36.155.80"
      - "tourism-chatbot-g2idbvy.svc.aped-4627-b74a.pinecone.io:54.88.199.204"
      - "ingress.aped-4627-b74a.pinecone.io:54.88.199.204"
    environment:
      - TZ=Asia/Ho_Chi_Minh
      - JAVA_TOOL_OPTIONS=-Duser.timezone=Asia/Ho_Chi_Minh -Djava.net.preferIPv4Stack=true -Djava.net.preferIPv4Addresses=true
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/analytics_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - EUREKA_HOST=service-discovery
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_ENV=${PINECONE_ENV}
      - PINECONE_HOST=${PINECONE_HOST}

    depends_on:
      service-discovery:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8087/actuator/health" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - tourism-network

# ======================== VOLUMES & NETWORKS ========================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  keycloak_data:
    driver: local

networks:
  tourism-network:
    driver: bridge
