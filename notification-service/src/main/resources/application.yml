server:
  port: 8086

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/notification_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── Mail ───
  mail:
    host: smtp.gmail.com
    port: 587
    default-encoding: UTF-8
    username: ${MAIL_USERNAME:trananhthu270904@gmail.com}
    password: ${MAIL_PASSWORD:kskw auzz nimm uybc}
    properties:
      mail.smtp:
        auth: true
        starttls:
          enable: true
          required: true
        connectiontimeout: 5000
        timeout: 5000
        writetimeout: 5000

  # ─── Redis ───
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  # ─── RabbitMQ ───
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2
          max-interval: 10000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  # Disable health indicators that cause false DOWN status in Eureka:
  # - MailHealthIndicator: SMTP connection to Gmail times out (96s) in Docker
  # - RedisHealthIndicator: can be slow to respond in some network conditions
  health:
    mail:
      enabled: false
    redis:
      enabled: false
    rabbit:
      enabled: false

app:
  admin:
    email: ${ADMIN_EMAIL:22110431@student.hcmute.edu.vn}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
