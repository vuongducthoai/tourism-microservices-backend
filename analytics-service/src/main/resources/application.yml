server:
  port: 8087

spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/analytics_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}

# ─── Gemini AI ───
gemini:
  api:
    key: ${GEMINI_API_KEY:AIzaSyCigeXq2FoA4cD3VNqepX5QShV9aq_yn04}
  generation:
    model: gemini-2.0-flash
    temperature: 0.7
    max-tokens: 1000

# ─── Chatbot / Vector DB ───
chatbot:
  vector-db:
    provider: pinecone
    pinecone:
      api-key: ${PINECONE_API_KEY:pcsk_4NU2Hz_FNyvrV1c4YHNEJi1rdEvkEnJLE7wUAihBLpizDAvMbg9UwzhY7i5hr4U4NToVM7}
      environment: ${PINECONE_ENV:us-east-1-aws}
      index-name: tourism-chatbot
      host: ${PINECONE_HOST:https://tourism-chatbot-g2idbvy.svc.aped-4627-b74a.pinecone.io}
  embedding:
    model: llama-text-embed-v2
    dimension: 1024
    max-tokens: 1000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    eureka:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
