server:
  port: 8087

spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/analytics_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}

# ─── Gemini AI ───
gemini:
  api:
    key: ${GEMINI_API_KEY:your-gemini-api-key}
  generation:
    model: gemini-2.0-flash
    temperature: 0.7
    max-tokens: 1000

# ─── Chatbot / Vector DB ───
chatbot:
  vector-db:
    provider: pinecone
    pinecone:
      api-key: ${PINECONE_API_KEY:your-pinecone-key}
      environment: ${PINECONE_ENV:us-east-1-aws}
      index-name: tourism-chatbot
      host: ${PINECONE_HOST:https://tourism-chatbot.svc.pinecone.io}
  embedding:
    model: text-embedding-004
    dimension: 768
    max-tokens: 1000

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
