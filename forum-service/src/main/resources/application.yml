server:
  port: 8085

spring:
  application:
    name: forum-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/forum_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 10s
  cache:
    type: redis
    cache-names:
      - categories
      - popularCategories
      - tags
      - popularTags
      - tagsByCategory
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism/protocol/openid-connect/certs


cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:dnt8vx1at}
  api-key: ${CLOUDINARY_API_KEY:939641688935771}
  api-secret: ${CLOUDINARY_API_SECRET:WPzZSJqg4MVvHKUuvPFeHL981J0}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      iam-service:
        connectTimeout: 5000
        readTimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html


groq:
  api:
    key: ${GROQ_API_KEY}
    model: llama-3.3-70b-versatile

moderation:
  thresholds:
    safe: 0.3     # score < 0.3  → SAFE → auto publish
    toxic: 0.7   # score >= 0.7 → TOXIC → auto reject
     # 0.3 – 0.7 → BORDERLINE → chờ admin duyệt
  enabled: true  # false = tắt moderation, mọi bài tự động PUBLISHED

forum:
  ratelimit:
    enabled: true
    comment-cooldown-sec: 15      # tối thiểu 15s giữa 2 comment
    post-cooldown-sec: 60         # tối thiểu 60s giữa 2 bài
    max-comments-per-day: 100     # quota comment/ngày
    max-posts-per-day: 10         # quota bài viết/ngày

  # ── Chính sách thưởng coin forum (PLAN_FORUM_COIN_REWARD.md) ──
  # 1 coin = 1.000đ — coin rút được tiền thật nên mọi con số đều thận trọng.
  reward:
    enabled: true                       # false = tắt toàn bộ thưởng coin forum
    daily-cap: 6                        # trần coin/ngày/user (vượt → im lặng không cộng)
    post-amount: 2.0                    # thưởng bài PUBLISHED giữ vững sau 24h
    post-delay-hours: 24                # độ trễ thưởng bài (chống đăng → nhận coin → xóa)
    max-rewarded-posts-per-day: 3       # tối đa 3 bài/ngày được thưởng
    post-like-milestones: 5,20,50,100   # mốc like bài → +post-like-milestone-amount/mốc
    post-like-milestone-amount: 0.5
    comment-amount: 0.2                 # thưởng comment SAFE đủ dài
    min-comment-length: 15              # chặn "hay quá", "ok"
    max-rewarded-comments-per-day: 10
    comment-like-milestones: 5,15       # mốc like comment
    comment-like-milestone-amount: 0.2
    follow-amount: 0.3                  # thưởng người ĐƯỢC follow (1 lần/cặp trọn đời)
    max-follow-rewards-per-day: 10
    daily-amount: 0.5                   # daily streak: 1 lần/ngày khi có tương tác
    streak-bonus: 2.0                   # bonus mỗi khi chuỗi đạt bội số streak-length
    streak-length: 7
    schedule-interval-ms: 300000        # quét bài đủ 24h mỗi 5 phút
    retry-interval-ms: 300000           # retry reward PENDING mỗi 5 phút
    alert-interval-ms: 3600000          # quét rule anti-fraud sinh cảnh báo mỗi 1 giờ
    # Lưu ý: các giá trị trên là MẶC ĐỊNH — admin có thể ghi đè runtime qua
    # trang Admin > Coin diễn đàn > Cấu hình (lưu bảng forum_reward_configs, hiệu lực ngay)

