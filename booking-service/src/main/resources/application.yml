server:
  port: 8083

spring:
  application:
    name: booking-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/booking_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:tourism}
    password: ${RABBITMQ_PASSWORD:tourism123}
    publisher-confirm-type: correlated
    publisher-returns: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-workers
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.tourism.booking.dto.request"
        spring.json.value.default.type: com.tourism.booking.dto.request.CreateBookingRequest
    listener:
      missing-topics-fatal: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism
          jwk-set-uri: ${KEYCLOAK_SERVER_URL:http://localhost:8180}/realms/tourism/protocol/openid-connect/certs


eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

feign:
  client:
    config:
      tour-catalog-service:
        connectTimeout: 5000
        readTimeout: 5000
      payment-service:
        connectTimeout: 5000
        readTimeout: 5000
      iam-service:
        connectTimeout: 5000
        readTimeout: 5000

# ── Quỹ Trồng Cây Xanh (PLAN_GREEN_FUND_TRONG_CAY) ──
greenfund:
  enabled: true
  cost-per-tree: 1000                  # VND/cây (= 1 coin)
  booking-contribution-percent: 0.5    # trích 0.5% giá trị booking PAID (từ doanh thu, KHÔNG thu thêm khách)
  min-donation-coin: 1                 # góp tối thiểu 1 coin
  convert-interval-ms: 3600000         # quy đổi quỹ -> cây mỗi 1 giờ
  target-trees: 1000                   # mục tiêu số cây (progress bar dashboard)
  target-label: "Mục tiêu 2026"        # nhãn mục tiêu hiển thị

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: booking-service

sepay:
  api-url: https://my.sepay.vn/userapi
  token: 5DIRHLIEPC9Y0GFKSNXACCQPEREHL3A1BVNTKS8X8DRFNHWDRXFWK4PWMUZKQG0J
  account-number: "10002897094"
  account-name: TRAN ANH THU
  bank-code: TCB
